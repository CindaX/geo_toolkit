[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geo-toolkit"
version = "0.1.0"
description = "GEO (Generative Engine Optimization) toolkit — shared infra for three MVP apps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "geo_toolkit" }]
dependencies = [
    "streamlit>=1.30",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "shared",
    "mvp_a_audit",
    "mvp_b_prompt",
    "mvp_c_assets",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
